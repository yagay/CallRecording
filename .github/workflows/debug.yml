name: Debug APK

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/debug.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already provides the Android SDK. Avoid setup-android@v3:
      # its deprecated 'sdkmanager tools' install fails on current runners.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallRecording-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
